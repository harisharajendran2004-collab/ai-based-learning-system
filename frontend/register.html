<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration - AI Learn</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <header>

        <nav class="navbar">

            <div class="logo">
                AI Learn
            </div>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="login.html">
                    Login
                </a>

            </div>

        </nav>

    </header>


    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-icon">
                🎓
            </div>

            <h1>Create Account</h1>

            <p class="auth-description">
                Create your account and start personalized learning.
            </p>


            <form id="registerForm">


                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="registerEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="course">
                    Course
                </label>

                <select id="course" required>

                    <option value="">
                        Select your course
                    </option>

                    <option value="MCA">
                        MCA
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="BSc Computer Science">
                        B.Sc Computer Science
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >


                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>


            <p class="auth-bottom">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <footer>

        <h3>
            AI-Based Personalized Learning System
        </h3>

        <p>
            Learn Smarter. Learn Your Way.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
